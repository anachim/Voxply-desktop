name: Live browser e2e

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HUB_HTTP_PORT: "3010"
      HUB_VOICE_UDP_PORT: "3011"
      OWNER_PUBKEY: "03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Wavvon/Wavvon-server
          ref: develop
          path: _server

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: _server

      - name: Build the hub and the demo bot
        working-directory: _server
        run: cargo build -p wavvon-hub -p ttt-bot

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter wavvon-web exec playwright install --with-deps chromium

      - name: Create the hub database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE wavvon_e2e"

      - name: Start the hub
        working-directory: _server
        env:
          WAVVON_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wavvon_e2e
          WAVVON_OWNER_PUBKEY: ${{ env.OWNER_PUBKEY }}
          WAVVON_HTTP_PORT: ${{ env.HUB_HTTP_PORT }}
          WAVVON_VOICE_UDP_PORT: ${{ env.HUB_VOICE_UDP_PORT }}
          WAVVON_PUBLIC_URL: http://localhost:${{ env.HUB_HTTP_PORT }}
          WAVVON_WEB_CLIENT_DIR: ""
        run: |
          ./target/debug/wavvon-hub > "$RUNNER_TEMP/hub.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -m 2 "http://localhost:$HUB_HTTP_PORT/info" >/dev/null; then
              echo "hub answered /info after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::hub never answered /info"
          cat "$RUNNER_TEMP/hub.log"
          exit 1

      - name: Start the tic-tac-toe bot
        working-directory: _server
        env:
          HUB_URL: http://localhost:${{ env.HUB_HTTP_PORT }}
          IDENTITY_PATH: ${{ runner.temp }}/ttt-bot-identity.json
        run: |
          ./target/debug/ttt-bot > "$RUNNER_TEMP/ttt-bot.log" 2>&1 &
          for i in $(seq 1 60); do
            pubkey=$(sed -n 's/^Bot pubkey: //p' "$RUNNER_TEMP/ttt-bot.log" | head -1)
            if [ -n "$pubkey" ]; then
              echo "TTT_BOT_PUBKEY=$pubkey" >> "$GITHUB_ENV"
              echo "ttt-bot printed its pubkey after ${i}s: $pubkey"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ttt-bot never printed its pubkey"
          cat "$RUNNER_TEMP/ttt-bot.log"
          exit 1

      - name: Live e2e
        working-directory: apps/web
        env:
          WAVVON_E2E_HUB_URL: http://localhost:${{ env.HUB_HTTP_PORT }}
          TTT_BOT_PUBKEY: ${{ env.TTT_BOT_PUBKEY }}
        run: pnpm run test:e2e:live

      - name: Hub log
        if: always()
        run: cat "$RUNNER_TEMP/hub.log" || true

      - name: Bot log
        if: always()
        run: cat "$RUNNER_TEMP/ttt-bot.log" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
